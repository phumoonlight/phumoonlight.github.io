name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  # Lets you redeploy the current commit from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  # deploy-pages authenticates to the Pages service with an OIDC token.
  id-token: write

# Queue deploys rather than cancelling: a half-finished rollout should still land.
concurrency:
  group: pages
  cancel-in-progress: false

# Every action below is on a major that ships a node24 runtime. Older majors
# still work, but the runners force them onto node24 anyway and annotate each
# run with a deprecation warning.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Matches the local toolchain, so CI and a dev machine agree.
          node-version: 24
          cache: npm

      - uses: actions/configure-pages@v6

      - run: npm ci

      - run: npm run build

      # Composite action; its pinned upload-artifact is node24 as of v5.
      - uses: actions/upload-pages-artifact@v5
        with:
          # Where `output: "export"` writes the static site.
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
